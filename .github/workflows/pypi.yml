name: Publish to PyPI

# Publishes the distribution artifacts attached to a GitHub Release to PyPI (project
# `oscal-mcp`). Mirrors the oscal-class workflow of the same name: it does NOT build —
# `publish.yml` (the "Release" workflow) builds the wheel/sdist and attaches them to the
# Release; this workflow uploads those exact assets. Manually dispatched and re-runnable.
#
# Uses PyPI Trusted Publishing (OIDC) — no API token. Requires, on PyPI, a trusted
# publisher for project `oscal-mcp` pointing at this repo, workflow `pypi.yml`, and the
# `pypi` environment; and a GitHub `pypi` environment (optionally with required reviewers).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to PyPI (e.g. v1.1.0)"
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish release artifacts to PyPI
    if: github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download the release's distribution artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" \
            --pattern "*.whl" --pattern "*.tar.gz" --dir dist
          ls -l dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
